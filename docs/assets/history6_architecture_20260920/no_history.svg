<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<title>No-History 网络结构</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="70" y="80" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="46" font-weight="850" fill="#172033" text-anchor="start">No-History 网络结构</text><text x="70" y="122" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="21" font-weight="500" fill="#64748b" text-anchor="start">当前 MoMaRT fair-history 的无长期历史下界；不是移除整个 Transformer。</text><rect x="70" y="175" width="1660" height="610" rx="26" fill="#ffffff" stroke="#d8e1ee" stroke-width="2" filter="url(#shadow)"/><text x="115" y="230" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="800" fill="#1d4ed8" text-anchor="start">当前观测路径</text><rect x="115" y="265" width="285" height="145" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="257.5" y="319.5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="257.5" dy="0">raw 当前观测</tspan><tspan x="257.5" dy="25">RGB×2 + Depth×2</tspan><tspan x="257.5" dy="25">proprio + scan + task id</tspan></text><line x1="405" y1="337" x2="485" y2="337" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="265" width="330" height="145" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="665.0" y="332.0" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="665.0" dy="0">当前观测编码</tspan><tspan x="665.0" dy="25">global 256 token ×2</tspan></text><text x="115" y="505" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="800" fill="#64748b" text-anchor="start">长期历史路径</text><rect x="115" y="540" width="285" height="155" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="257.5" y="599.5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="257.5" dy="0">不读取历史</tspan><tspan x="257.5" dy="25">memory=None</tspan><tspan x="257.5" dy="25">ep_step=None</tspan></text><line x1="405" y1="617" x2="485" y2="617" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="500" y="540" width="330" height="155" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="665.0" y="624.5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="665.0" dy="0">Tm = 0；不实例化 Q-Former</tspan></text><line x1="835" y1="337" x2="975" y2="435" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><line x1="835" y1="617" x2="975" y2="505" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="990" y="360" width="310" height="220" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1145.0" y="427.0" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="1145.0" dy="0">条件序列</tspan><tspan x="1145.0" dy="25">[τ, memory(0),</tspan><tspan x="1145.0" dy="25">obs(2)]</tspan><tspan x="1145.0" dy="25">memory 全局可见</tspan><tspan x="1145.0" dy="25">obs 用 PTP mask</tspan></text><line x1="1305" y1="470" x2="1380" y2="470" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="1395" y="360" width="280" height="220" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="1535.0" y="427.0" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="1535.0" dy="0">Decoder ×8</tspan><tspan x="1535.0" dy="25">causal self-attn</tspan><tspan x="1535.0" dy="25">+ cross-attn</tspan><tspan x="1535.0" dy="25">→ εθ</tspan><tspan x="1535.0" dy="25">DDPM×50</tspan></text><rect x="70" y="825" width="1660" height="95" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="865" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="800" fill="#64748b" text-anchor="start">张量口径</text><text x="225" y="865" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="550" fill="#334155" text-anchor="start">近期 obs = [B,2,256]；长期 memory = [B,0,256]；带噪动作 = [B,9,10]；输出 εθ = [B,9,10]。</text><text x="100" y="900" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="800" fill="#64748b" text-anchor="start">动作执行</text><text x="225" y="900" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="550" fill="#334155" text-anchor="start">50 次 DDPM 反向去噪得到 9-step action horizon，环境执行其中 8 个动作。</text></svg>