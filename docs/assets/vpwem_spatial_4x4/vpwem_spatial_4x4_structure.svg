<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5fc"/>
    </linearGradient>
    <linearGradient id="newbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0ff"/>
      <stop offset="1" stop-color="#ede7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#486581"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7048e8"/>
    </marker>
    <style>
      .title{font:700 38px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#102a43}
      .subtitle{font:400 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#486581}
      .section{font:700 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#102a43}
      .head{font:700 20px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#102a43}
      .body{font:500 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#243b53}
      .small{font:400 14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#627d98}
      .tiny{font:500 12px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#486581}
      .pill{font:700 15px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#fff}
      .shape{font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334e68}
      .shapeLight{font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#ffffff}
      .warn{font:700 14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#b42318}
      .edge{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .edgeP{stroke:#7048e8;stroke-width:3.5;fill:none;marker-end:url(#arrowPurple)}
      .dash{stroke:#9fb3c8;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <text x="70" y="65" class="title">VPWEM → 保留空间特征的 4×4 Pooling 衍生结构</text>
  <text x="70" y="102" class="subtitle">近期工作记忆保持原路径；只替换“更早历史”的表示与压缩方式</text>

  <!-- Baseline strip -->
  <rect x="55" y="140" width="1690" height="205" rx="26" fill="#ffffff" stroke="#c5d7e8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="78" y="158" width="205" height="34" rx="17" fill="#607d9b"/>
  <text x="180" y="181" text-anchor="middle" class="pill">原 VPWEM 基线</text>

  <g>
    <rect x="80" y="215" width="205" height="100" rx="16" fill="#eef6ff" stroke="#4b8fe8" stroke-width="2"/>
    <text x="182" y="244" text-anchor="middle" class="head">多模态观测</text>
    <text x="182" y="270" text-anchor="middle" class="small">2 路 RGB + joints</text>
    <text x="182" y="299" text-anchor="middle" class="shape">[B,T,Nc,3,H,W]</text>
  </g>
  <path d="M285 265H330" class="edge"/>
  <g>
    <rect x="330" y="195" width="405" height="140" rx="16" fill="#eef6ff" stroke="#4b8fe8" stroke-width="2.5"/>
    <text x="532" y="222" text-anchor="middle" class="head">原 VPWEM：完整 ResNet18</text>
    <text x="532" y="247" text-anchor="middle" class="shape">GAP 前：[B,T,Nc,512,H′,W′]</text>
    <rect x="382" y="258" width="300" height="28" rx="14" fill="#fff0ee" stroke="#e6574f" stroke-width="1.5"/>
    <text x="532" y="278" text-anchor="middle" class="warn">Global AvgPool：H′×W′ → 1×1</text>
    <text x="532" y="307" text-anchor="middle" class="small">两路 [B,T,512] + joints 25 → MLP</text>
    <text x="532" y="329" text-anchor="middle" class="shape">输出 [B,T,256]（H/W 已消失）</text>
  </g>
  <path d="M735 265H775" class="edge"/>
  <g>
    <rect x="775" y="205" width="280" height="110" rx="16" fill="#fff6e6" stroke="#e49a25" stroke-width="2"/>
    <text x="915" y="238" text-anchor="middle" class="head">FIFO + Q-Former</text>
    <text x="915" y="268" text-anchor="middle" class="small">只能处理时间 token，不再有空间网格</text>
    <text x="915" y="297" text-anchor="middle" class="shape">[B,Tₕ,256] → [B,M,256]</text>
  </g>
  <path d="M1055 260H1095" class="edge"/>
  <g>
    <rect x="1095" y="205" width="315" height="110" rx="16" fill="#e9fbf5" stroke="#23a87a" stroke-width="2"/>
    <text x="1252" y="238" text-anchor="middle" class="head">LongMem Diffusion Policy</text>
    <text x="1252" y="268" text-anchor="middle" class="small">动作 token 对条件做 cross-attention</text>
    <text x="1252" y="297" text-anchor="middle" class="shape">condition: [B,1+M+Tₒ,256]</text>
  </g>
  <path d="M1410 260H1450" class="edge"/>
  <g>
    <rect x="1450" y="215" width="230" height="90" rx="16" fill="#102f4b" stroke="#102f4b" stroke-width="2"/>
    <text x="1565" y="249" text-anchor="middle" class="pill">动作去噪输出</text>
    <text x="1565" y="282" text-anchor="middle" class="shapeLight">[B,Tₐ,action_dim]</text>
  </g>

  <!-- New architecture container -->
  <rect x="55" y="390" width="1690" height="700" rx="30" fill="url(#newbg)" stroke="#8b6de9" stroke-width="3" filter="url(#shadow)"/>
  <rect x="78" y="410" width="325" height="38" rx="19" fill="#7048e8"/>
  <text x="240" y="436" text-anchor="middle" class="pill">改造：Spatial History 4×4</text>
  <text x="430" y="436" class="small">紫色路径为替换后的历史分支</text>

  <!-- Input -->
  <g>
    <rect x="90" y="510" width="245" height="180" rx="20" fill="#ffffff" stroke="#88a8c5" stroke-width="2"/>
    <text x="212" y="548" text-anchor="middle" class="head">连续多模态观测</text>
    <g fill="#dcecff" stroke="#3f8be5" stroke-width="2">
      <rect x="112" y="575" width="50" height="44" rx="7"/>
      <rect x="170" y="575" width="50" height="44" rx="7"/>
      <rect x="228" y="575" width="50" height="44" rx="7"/>
      <rect x="286" y="575" width="28" height="44" rx="7"/>
    </g>
    <text x="137" y="603" text-anchor="middle" class="tiny">o₁</text>
    <text x="195" y="603" text-anchor="middle" class="tiny">o₂</text>
    <text x="253" y="603" text-anchor="middle" class="tiny">…</text>
    <text x="300" y="603" text-anchor="middle" class="tiny">oₜ</text>
    <text x="212" y="651" text-anchor="middle" class="shape">RGB: [B,T,Nc,3,H,W]</text>
    <text x="212" y="676" text-anchor="middle" class="shape">state: [B,T,25]</text>
  </g>

  <!-- split -->
  <path d="M335 600H390V495H445" class="edge"/>
  <path d="M390 600V800H445" class="edgeP"/>
  <text x="395" y="480" class="small">最近 Tₒ 步</text>
  <text x="395" y="785" class="small">更早 Tₕ 步</text>

  <!-- working memory unchanged -->
  <g>
    <rect x="445" y="475" width="335" height="180" rx="20" fill="#eaf4ff" stroke="#2f80ed" stroke-width="3"/>
    <rect x="475" y="495" width="275" height="36" rx="18" fill="#2f80ed"/>
    <text x="612" y="520" text-anchor="middle" class="pill">Working Memory（不变）</text>
    <text x="612" y="558" text-anchor="middle" class="body">完整 ResNet18 + GAP</text>
    <text x="612" y="584" text-anchor="middle" class="small">两路视觉 + joints 融合</text>
    <text x="612" y="616" text-anchor="middle" class="shape">[B,Tₒ,256]</text>
    <text x="612" y="642" text-anchor="middle" class="tiny">默认 Tₒ=2</text>
  </g>

  <!-- spatial feature extraction -->
  <g>
    <rect x="445" y="715" width="335" height="215" rx="20" fill="#ffffff" stroke="#7048e8" stroke-width="3"/>
    <text x="612" y="752" text-anchor="middle" class="head">ResNet 空间层（GAP 前截取）</text>
    <text x="612" y="782" text-anchor="middle" class="small">每个相机、每个历史时间步独立编码</text>
    <text x="612" y="816" text-anchor="middle" class="shape">[B,Tₕ,Nc,Cb,Hb,Wb]</text>
    <path d="M492 848H732" stroke="#ccbff5" stroke-width="2"/>
    <text x="612" y="878" text-anchor="middle" class="body">1×1 Conv / Linear 通道投影</text>
    <text x="612" y="907" text-anchor="middle" class="shape">→ [B,Tₕ,Nc,256,Hb,Wb]</text>
  </g>

  <path d="M780 822H835" class="edgeP"/>

  <!-- pool box -->
  <g>
    <rect x="835" y="700" width="330" height="260" rx="20" fill="#fff" stroke="#7048e8" stroke-width="3"/>
    <text x="1000" y="738" text-anchor="middle" class="head">Adaptive AvgPool 4×4</text>
    <text x="1000" y="768" text-anchor="middle" class="shape">[256,Hb,Wb] → [256,4,4]</text>
    <g fill="#e7dfff" stroke="#7048e8" stroke-width="1.5">
      <rect x="940" y="795" width="28" height="28"/><rect x="970" y="795" width="28" height="28"/><rect x="1000" y="795" width="28" height="28"/><rect x="1030" y="795" width="28" height="28"/>
      <rect x="940" y="825" width="28" height="28"/><rect x="970" y="825" width="28" height="28"/><rect x="1000" y="825" width="28" height="28"/><rect x="1030" y="825" width="28" height="28"/>
      <rect x="940" y="855" width="28" height="28"/><rect x="970" y="855" width="28" height="28"/><rect x="1000" y="855" width="28" height="28"/><rect x="1030" y="855" width="28" height="28"/>
      <rect x="940" y="885" width="28" height="28"/><rect x="970" y="885" width="28" height="28"/><rect x="1000" y="885" width="28" height="28"/><rect x="1030" y="885" width="28" height="28"/>
    </g>
    <text x="1000" y="940" text-anchor="middle" class="body">每帧每相机 = 16 个空间 token</text>
  </g>

  <path d="M1165 830H1220" class="edgeP"/>

  <!-- flatten tokens -->
  <g>
    <rect x="1220" y="690" width="425" height="280" rx="20" fill="#fff" stroke="#7048e8" stroke-width="3"/>
    <text x="1432" y="730" text-anchor="middle" class="head">展平为时空历史 token</text>
    <text x="1432" y="765" text-anchor="middle" class="shape">[B,Tₕ,Nc,256,4,4]</text>
    <text x="1432" y="797" text-anchor="middle" class="shape">→ [B,Tₕ,Nc,16,256]</text>
    <text x="1432" y="829" text-anchor="middle" class="shape">→ [B,Ns,256]</text>
    <rect x="1262" y="855" width="340" height="70" rx="13" fill="#f3efff" stroke="#b29df1"/>
    <text x="1432" y="883" text-anchor="middle" class="body">Ns = Tₕ × Nc × 16</text>
    <text x="1432" y="910" text-anchor="middle" class="small">加时间 + 相机 + 2D 空间位置编码</text>
    <text x="1432" y="952" text-anchor="middle" class="tiny">两相机且 Tₕ=16 时：Ns=512</text>
  </g>

  <!-- state fusion -->
  <g>
    <rect x="835" y="990" width="810" height="70" rx="16" fill="#fff9e8" stroke="#d9a425" stroke-width="2"/>
    <text x="860" y="1018" class="body">历史 joints 保留：</text>
    <text x="1015" y="1018" class="shape">[B,Tₕ,25] → MLP → [B,Tₕ,256]</text>
    <text x="860" y="1045" class="small">可作为 state token 追加，或广播融合进同时间步的空间 token；不要因改空间分支而丢掉本体状态。</text>
  </g>
  <path d="M1215 990V970" class="dash"/>

  <!-- policy right upper -->
  <path d="M780 565H1320V535" class="edge"/>
  <path d="M1645 830H1690V610H1590" class="edgeP"/>
  <g>
    <rect x="1160" y="465" width="430" height="185" rx="22" fill="#e9fbf5" stroke="#20a777" stroke-width="3"/>
    <text x="1375" y="505" text-anchor="middle" class="head">LongMem Diffusion Policy</text>
    <text x="1375" y="537" text-anchor="middle" class="small">去掉历史 Q-Former；动作直接读取空间历史 token</text>
    <text x="1375" y="572" text-anchor="middle" class="shape">action query: [B,Tₐ,256]</text>
    <text x="1375" y="601" text-anchor="middle" class="shape">condition: [B,1+Tₒ+Ns,256]</text>
    <text x="1375" y="630" text-anchor="middle" class="small">Cross-Attention → [B,Tₐ,action_dim]</text>
  </g>

  <!-- replacement badge -->
  <rect x="420" y="365" width="960" height="48" rx="24" fill="#fff2f0" stroke="#e6574f" stroke-width="2"/>
  <text x="900" y="387" text-anchor="middle" class="warn">关键：原输出 [B,T,256] 已无 H/W，不能在其后再做 2D Pooling</text>
  <text x="900" y="405" text-anchor="middle" class="tiny">新结构必须在 ResNet 的 Global AvgPool 之前截取空间特征，再池化到 4×4</text>

  <!-- footer -->
  <text x="70" y="1132" class="section">核心变化：</text>
  <text x="215" y="1132" class="body">原 VPWEM 用固定 M 个学习型时间摘要；新结构用 Ns 个显式时空 token 保留“哪里出现了什么”。</text>
  <text x="70" y="1160" class="small">注意：4×4 pooling 压缩的是空间分辨率，不压缩历史时间长度；Ns 会随 Tₕ 和相机数线性增长。</text>
</svg>
