<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf4"/><stop offset="1" stop-color="#f5f8fc"/></linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#3d2914" flood-opacity="0.13"/></filter>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52667a"/></marker>
    <style>
      .title{font:700 38px 'Noto Sans CJK SC',sans-serif;fill:#102a43}.sub{font:400 19px 'Noto Sans CJK SC',sans-serif;fill:#52667a}.h{font:700 22px 'Noto Sans CJK SC',sans-serif;fill:#102a43}.t{font:500 17px 'Noto Sans CJK SC',sans-serif;fill:#243b53}.s{font:400 15px 'Noto Sans CJK SC',sans-serif;fill:#627d98}.pill{font:700 16px 'Noto Sans CJK SC',sans-serif;fill:white}.edge{stroke:#52667a;stroke-width:3;fill:none;marker-end:url(#ar2)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="70" y="70" class="title">PER-VPWEM：事件选择写入替代 FIFO</text>
  <text x="70" y="106" class="sub">正式 PER-delta｜只改变“历史如何进入固定容量 bank”，下游 Q-Former、token 预算和 diffusion policy 保持不变</text>

  <g filter="url(#sh2)">
    <rect x="60" y="165" width="245" height="160" rx="22" fill="#fff" stroke="#b8cde3" stroke-width="2"/>
    <text x="182" y="208" text-anchor="middle" class="h">连续观测</text>
    <text x="182" y="242" text-anchor="middle" class="t">o₁, o₂, …, oₜ</text>
    <rect x="97" y="268" width="170" height="35" rx="17" fill="#6688a8"/><text x="182" y="292" text-anchor="middle" class="pill">视觉编码器</text>
  </g>

  <path d="M305 245H375" class="edge"/>
  <g filter="url(#sh2)">
    <rect x="375" y="150" width="275" height="190" rx="22" fill="#eaf4ff" stroke="#2f80ed" stroke-width="3"/>
    <text x="512" y="193" text-anchor="middle" class="h">Working Memory</text>
    <text x="512" y="229" text-anchor="middle" class="t">最近 L=2 个 embedding</text>
    <text x="512" y="263" text-anchor="middle" class="s">保持原 VPWEM 路径</text>
    <rect x="427" y="286" width="170" height="33" rx="16" fill="#2f80ed"/><text x="512" y="309" text-anchor="middle" class="pill">UNCHANGED</text>
  </g>

  <path d="M305 270H340V480H375" class="edge"/>
  <g filter="url(#sh2)">
    <rect x="375" y="400" width="275" height="170" rx="22" fill="#fff4e5" stroke="#f2994a" stroke-width="3"/>
    <text x="512" y="443" text-anchor="middle" class="h">更早历史</text>
    <text x="512" y="478" text-anchor="middle" class="t">z₁ … zₜ₋L</text>
    <text x="512" y="513" text-anchor="middle" class="s">候选事件流</text>
    <rect x="432" y="529" width="160" height="28" rx="14" fill="#e87817"/><text x="512" y="549" text-anchor="middle" class="pill">PER INPUT</text>
  </g>

  <path d="M650 485H710" class="edge"/>
  <g filter="url(#sh2)">
    <rect x="710" y="365" width="350" height="245" rx="24" fill="#fff" stroke="#e87817" stroke-width="4"/>
    <rect x="742" y="389" width="286" height="38" rx="19" fill="#e87817"/>
    <text x="885" y="415" text-anchor="middle" class="pill">① Event Scoring</text>
    <text x="885" y="462" text-anchor="middle" class="h">事件效用分数</text>
    <rect x="760" y="486" width="250" height="50" rx="12" fill="#fff2e4" stroke="#f2994a" stroke-width="2"/>
    <text x="885" y="518" text-anchor="middle" class="t">uₜ = 1 − cosine(zₜ, zₜ₋₁)</text>
    <text x="885" y="560" text-anchor="middle" class="s">视觉表征变化越大，候选事件分数越高</text>
    <text x="885" y="587" text-anchor="middle" class="s">正式结果使用 delta；predictive/hybrid 已筛除</text>
  </g>

  <path d="M1060 485H1110" class="edge"/>
  <g filter="url(#sh2)">
    <rect x="1110" y="230" width="425" height="480" rx="24" fill="#fff9f2" stroke="#e87817" stroke-width="4"/>
    <rect x="1143" y="254" width="360" height="40" rx="20" fill="#e87817"/>
    <text x="1323" y="281" text-anchor="middle" class="pill">② Event Bank Management（K=8）</text>

    <g transform="translate(1150 325)">
      <circle cx="24" cy="22" r="21" fill="#e87817"/><text x="24" y="29" text-anchor="middle" class="pill">A</text>
      <text x="62" y="17" class="h">Anchor</text><text x="62" y="43" class="s">始终保留 episode 起点</text>
    </g>
    <g transform="translate(1150 408)">
      <circle cx="24" cy="22" r="21" fill="#e87817"/><text x="24" y="29" text-anchor="middle" class="pill">W</text>
      <text x="62" y="17" class="h">Write gate</text><text x="62" y="43" class="s">分数过阈值或达到最长等待间隔才写入</text>
    </g>
    <g transform="translate(1150 491)">
      <circle cx="24" cy="22" r="21" fill="#e87817"/><text x="24" y="29" text-anchor="middle" class="pill">M</text>
      <text x="62" y="17" class="h">Merge / Update</text><text x="62" y="43" class="s">与已有事件高度相似时更新槽位</text>
    </g>
    <g transform="translate(1150 574)">
      <circle cx="24" cy="22" r="21" fill="#e87817"/><text x="24" y="29" text-anchor="middle" class="pill">R</text>
      <text x="62" y="17" class="h">Replace</text><text x="62" y="43" class="s">满容量时淘汰衰减效用最低的非 anchor 槽</text>
    </g>
    <text x="1323" y="676" text-anchor="middle" class="t">内容相关性决定记忆寿命</text>
  </g>

  <path d="M1323 710V754H1045" class="edge"/>
  <g filter="url(#sh2)">
    <rect x="715" y="700" width="330" height="130" rx="22" fill="#f4edff" stroke="#7b61ff" stroke-width="3"/>
    <text x="880" y="742" text-anchor="middle" class="h">原 Q-Former Compressor</text>
    <text x="880" y="776" text-anchor="middle" class="t">Event bank → M=2 memory tokens</text>
    <rect x="807" y="793" width="146" height="26" rx="13" fill="#7b61ff"/><text x="880" y="812" text-anchor="middle" class="pill">UNCHANGED</text>
  </g>

  <path d="M715 765H635" class="edge"/>
  <g filter="url(#sh2)">
    <rect x="235" y="680" width="400" height="170" rx="22" fill="#eafaf4" stroke="#20a779" stroke-width="3"/>
    <text x="435" y="724" text-anchor="middle" class="h">原 LongMem Diffusion Policy</text>
    <text x="435" y="760" text-anchor="middle" class="t">working tokens + memory tokens</text>
    <text x="435" y="791" text-anchor="middle" class="s">预测噪声 → 迭代去噪 → 动作 chunk</text>
    <rect x="362" y="809" width="146" height="26" rx="13" fill="#20a779"/><text x="435" y="828" text-anchor="middle" class="pill">UNCHANGED</text>
  </g>
  <path d="M512 340V650H435V680" class="edge"/>

  <rect x="70" y="395" width="235" height="184" rx="20" fill="#102a43"/>
  <text x="187" y="435" text-anchor="middle" class="pill">与 VPWEM 的唯一主变量</text>
  <text x="187" y="474" text-anchor="middle" style="font:600 17px 'Noto Sans CJK SC',sans-serif;fill:#ffe0bd">FIFO 写入 / 淘汰</text>
  <text x="187" y="507" text-anchor="middle" style="font:700 23px 'Noto Sans CJK SC',sans-serif;fill:white">↓</text>
  <text x="187" y="540" text-anchor="middle" style="font:600 17px 'Noto Sans CJK SC',sans-serif;fill:#ffe0bd">事件打分 + 选择保留</text>
  <text x="187" y="565" text-anchor="middle" style="font:400 14px 'Noto Sans CJK SC',sans-serif;fill:#b8cde3">token 数与下游策略均不增加</text>
</svg>
