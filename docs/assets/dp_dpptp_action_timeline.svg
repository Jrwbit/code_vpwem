<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">DP 与 DP-PTP 的观测和动作时间轴</title>
  <desc id="desc">两种方法都输入上一帧和当前帧。DP 预测并执行八个未来动作。DP-PTP 额外预测一个过去动作，只用上一帧观测预测该位置，然后执行其余八个未来动作。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#475569"/></marker>
    <style>
      text{font-family:'Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}
      .title{font-size:38px;font-weight:700}.subtitle{font-size:22px;fill:#475569}
      .section{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:600}
      .small{font-size:19px;fill:#475569}.symbol{font-size:29px;font-family:Georgia,serif}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.obs{fill:#dbeafe;stroke:#3b82f6;stroke-width:2}
      .past{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.action{fill:#c7d2fe;stroke:#6366f1;stroke-width:2}
      .line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1600" height="850" fill="#f8fafc"/>
  <text x="70" y="76" class="title">同样看两帧，DP-PTP 多预测一个过去动作</text>
  <text x="70" y="113" class="subtitle">图中的时间 t 是当前决策时刻；每次决策都实际执行 8 个未来动作。</text>

  <rect x="60" y="150" width="1480" height="288" rx="20" class="panel"/>
  <text x="90" y="202" class="section">DP</text>
  <text x="220" y="205" class="label">观测</text>
  <rect x="318" y="167" width="126" height="64" rx="9" class="obs"/>
  <rect x="468" y="167" width="126" height="64" rx="9" class="obs"/>
  <text x="381" y="207" class="symbol" text-anchor="middle">oₜ₋₁</text>
  <text x="531" y="207" class="symbol" text-anchor="middle">oₜ</text>
  <path d="M380 231 V270 H688 V295" class="line"/>
  <path d="M530 231 V255 H688 V295" class="line"/>
  <text x="655" y="249" class="small">两帧对所有动作可见</text>
  <text x="90" y="352" class="label">预测动作</text>
  <path d="M310 365 H1460" class="line"/>
  <line x1="624" y1="295" x2="624" y2="394" class="guide"/>
  <text x="455" y="330" class="small" text-anchor="middle">过去</text>
  <text x="1050" y="330" class="small" text-anchor="middle">当前 → 未来</text>
  <g>
    <rect x="640" y="337" width="91" height="56" rx="7" class="action"/><rect x="741" y="337" width="91" height="56" rx="7" class="action"/>
    <rect x="842" y="337" width="91" height="56" rx="7" class="action"/><rect x="943" y="337" width="91" height="56" rx="7" class="action"/>
    <rect x="1044" y="337" width="91" height="56" rx="7" class="action"/><rect x="1145" y="337" width="91" height="56" rx="7" class="action"/>
    <rect x="1246" y="337" width="91" height="56" rx="7" class="action"/><rect x="1347" y="337" width="91" height="56" rx="7" class="action"/>
  </g>
  <g class="symbol" text-anchor="middle">
    <text x="685" y="374">aₜ</text><text x="786" y="374">aₜ₊₁</text><text x="887" y="374">aₜ₊₂</text><text x="988" y="374">aₜ₊₃</text>
    <text x="1089" y="374">aₜ₊₄</text><text x="1190" y="374">aₜ₊₅</text><text x="1291" y="374">aₜ₊₆</text><text x="1392" y="374">aₜ₊₇</text>
  </g>
  <text x="1040" y="420" class="small" text-anchor="middle">生成 8 位 → 全部执行</text>

  <rect x="60" y="458" width="1480" height="316" rx="20" class="panel"/>
  <text x="90" y="510" class="section">DP-PTP</text>
  <text x="220" y="513" class="label">观测</text>
  <rect x="318" y="475" width="126" height="64" rx="9" class="obs"/>
  <rect x="468" y="475" width="126" height="64" rx="9" class="obs"/>
  <text x="381" y="515" class="symbol" text-anchor="middle">oₜ₋₁</text>
  <text x="531" y="515" class="symbol" text-anchor="middle">oₜ</text>
  <path d="M380 539 V566 H572 V610" class="line"/>
  <path d="M530 539 V552 H905 V610" class="line"/>
  <text x="605" y="595" class="small">上一动作只能看上一帧</text>
  <text x="945" y="595" class="small">未来动作可看两帧</text>
  <text x="90" y="672" class="label">预测动作</text>
  <path d="M310 685 H1460" class="line"/>
  <line x1="624" y1="608" x2="624" y2="712" class="guide"/>
  <rect x="538" y="645" width="91" height="56" rx="7" class="past"/>
  <g>
    <rect x="640" y="645" width="91" height="56" rx="7" class="action"/><rect x="741" y="645" width="91" height="56" rx="7" class="action"/>
    <rect x="842" y="645" width="91" height="56" rx="7" class="action"/><rect x="943" y="645" width="91" height="56" rx="7" class="action"/>
    <rect x="1044" y="645" width="91" height="56" rx="7" class="action"/><rect x="1145" y="645" width="91" height="56" rx="7" class="action"/>
    <rect x="1246" y="645" width="91" height="56" rx="7" class="action"/><rect x="1347" y="645" width="91" height="56" rx="7" class="action"/>
  </g>
  <g class="symbol" text-anchor="middle">
    <text x="583" y="682">aₜ₋₁</text><text x="685" y="682">aₜ</text><text x="786" y="682">aₜ₊₁</text><text x="887" y="682">aₜ₊₂</text>
    <text x="988" y="682">aₜ₊₃</text><text x="1089" y="682">aₜ₊₄</text><text x="1190" y="682">aₜ₊₅</text><text x="1291" y="682">aₜ₊₆</text><text x="1392" y="682">aₜ₊₇</text>
  </g>
  <text x="583" y="733" class="small" text-anchor="middle">预测但不执行</text>
  <text x="1040" y="733" class="small" text-anchor="middle">生成 8 个未来动作 → 执行这 8 位</text>
  <text x="70" y="823" class="small">灰色 = 过去动作辅助预测；紫色 = 实际执行的未来动作；蓝色 = 输入观测。</text>
</svg>
