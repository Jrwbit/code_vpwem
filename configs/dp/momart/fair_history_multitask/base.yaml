pipeline_name: fair_history_momart_multitask
mode: train
history_method: vpwem

data_root: /oss/sh2/vpwem_data/momart
task_datasets:
  - {name: unload_dishwasher_to_dresser_suboptimal, task_id: 0, path: '${data_root}/unload_dishwasher_to_dresser_suboptimal.hdf5'}
  - {name: unload_dishwasher_to_dresser_expert, task_id: 0, path: '${data_root}/unload_dishwasher_to_dresser_expert.hdf5'}
  - {name: table_cleanup_to_sink_suboptimal, task_id: 1, path: '${data_root}/table_cleanup_to_sink_suboptimal.hdf5'}
  - {name: table_cleanup_to_sink_expert, task_id: 1, path: '${data_root}/table_cleanup_to_sink_expert.hdf5'}
  - {name: table_cleanup_to_dishwasher_suboptimal, task_id: 2, path: '${data_root}/table_cleanup_to_dishwasher_suboptimal.hdf5'}
  - {name: table_cleanup_to_dishwasher_expert, task_id: 2, path: '${data_root}/table_cleanup_to_dishwasher_expert.hdf5'}
  - {name: table_setup_from_dishwasher_suboptimal, task_id: 3, path: '${data_root}/table_setup_from_dishwasher_suboptimal.hdf5'}
  - {name: table_setup_from_dishwasher_expert, task_id: 3, path: '${data_root}/table_setup_from_dishwasher_expert.hdf5'}
  - {name: table_setup_from_dresser_suboptimal, task_id: 4, path: '${data_root}/table_setup_from_dresser_suboptimal.hdf5'}
  - {name: table_setup_from_dresser_expert, task_id: 4, path: '${data_root}/table_setup_from_dresser_expert.hdf5'}
num_tasks: 5

shape_meta:
  action: {shape: [10]}
  obs:
    rgb: {shape: [3, 90, 120], type: rgb}
    rgb_wrist: {shape: [3, 90, 120], type: rgb}
    depth: {shape: [1, 90, 120], type: depth}
    depth_wrist: {shape: [1, 90, 120], type: depth}
    proprio: {shape: [10], type: low_dim}
    scan: {shape: [1, 100], type: scan}
action_dim: 10
obs_steps: 2
action_steps: 8
horizon: 9

rgb_model: resnet18
resize_shape: null
crop_shape: [75, 100]
random_crop: true
use_group_norm: true

# Shared 16-frame fair-history protocol.
dataset_memory_type: random_from_full
dataset_memory_subsample_ratio: 20
dataset_maximum_memory_length: 16
history_sampling_seed: 100
history_pool_size: 4

# DP-VPWEM Table I. physical_batch_size only controls memory use; gradients
# are accumulated to preserve a true effective batch of 64.
device: cuda:0
seed: 100
gradient_steps: 1000000
effective_batch_size: 64
physical_batch_size: 1
num_workers: 1
sample_steps: 50
temperature: 1.0
diffusion_num_layers: 8
short_cond_dropout: 0.3
long_cond_dropout: 0.3
p_drop_emb: 0.0
p_drop_attn: 0.3
lr: 0.0001
ema_rate: 0.999
adam_beta1: 0.9
adam_beta2: 0.999

pred_reg_coeff: 0
memory_aux_coeff: 0
counterfactual_memory_coeff: 0
counterfactual_memory_margin: 0.01
counterfactual_memory_probability: 1.0
counterfactual_negative_mode: none
counterfactual_objective: ranking

save_path: /oss/sh2/vpwem_outputs
exp_name: ${history_method}
group: dp_momart_fair_multitask
project: CleanDiffuser
wandb_mode: offline
log_freq: 1000
save_freq: 100000
keep_checkpoints: 3
work_dir: ${save_path}/fair_history_momart_multitask/${exp_name}/seed${seed}

hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false
