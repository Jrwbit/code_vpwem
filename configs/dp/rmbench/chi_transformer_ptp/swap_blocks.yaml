pipeline_name: dpptp_rmbench_image
env_name: swap_blocks
dataset_path: /home/wjr/code/rmbench/data/swap_blocks/demo_clean
mode: train
shape_meta:
  action:
    shape:
      - 14
  obs:
    head_cam:
      shape:
        - 3
        - 240
        - 320
      type: rgb
      source: observation/head_camera/rgb
    agent_pos:
      shape:
        - 14
      type: low_dim
      source: joint_action/vector
action_dim: 14
obs_steps: 2
action_steps: 8
inference_action_steps: 8
horizon: 9
rgb_model: resnet18
resize_shape: null
crop_shape:
  - 76
  - 76
random_crop: true
use_group_norm: true
use_seq: true
device: cuda:0
seed: 100
gradient_steps: 10
batch_size: 1
num_workers: 0
nn: chi_transformer
diffusion: ddpm
sample_steps: 50
temperature: 1.0
lr: 0.0001
log_freq: 1
save_freq: 10
save_on_exit: true
resume: false
resume_step: null
resume_model_path: null
resume_scheduler_path: null
reset_scheduler_on_resume: false
model_path: null
embedding_key: dp_emb
embedding_batch_size: 256
save_path: /home/wjr/code/vpwem/outputs/rmbench
project: CleanDiffuser
group: dp_rmbench
wandb_mode: offline
exp_name: ${env_name}/obs_${obs_steps}_act_${action_steps}/context
work_dir: ${save_path}/${pipeline_name}/${mode}/${exp_name}/${seed}
hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false
