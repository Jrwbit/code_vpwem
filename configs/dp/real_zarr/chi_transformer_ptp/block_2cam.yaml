pipeline_name: dpptp_real_zarr

# dataset
dataset_path: /home/wjr/code/vpwem/data/real_zarr/20260408wjryou_right_zarr
mode: train
shape_meta:
  action:
    shape:
      - 8
  obs:
    camera_0:
      shape:
        - 3
        - 240
        - 320
      type: rgb
    camera_1:
      shape:
        - 3
        - 240
        - 320
      type: rgb
    # Keep the framework multi-camera friendly. For a 3-camera task, add:
    # camera_2:
    #   shape: [3, 240, 320]
    #   type: rgb
    joint_state:
      shape:
        - 8
      type: low_dim

action_dim: 8
obs_steps: 2
action_steps: 8
horizon: 9

# obs encoder
rgb_model: resnet18
resize_shape: null
crop_shape:
  - 216
  - 288
random_crop: true
use_group_norm: true
use_seq: true

# train
device: cuda:0
seed: 100
gradient_steps: 160000
batch_size: 128
num_workers: 4
nn: chi_transformer
diffusion: ddpm
sample_steps: 50
temperature: 1.0
lr: 0.0001

# log
exp_name: block_2cam/obs_${obs_steps}_act_${action_steps}
save_path: /home/wjr/code/vpwem/outputs
project: CleanDiffuser
group: dpptp_real_zarr
wandb_mode: online
log_freq: 80
save_freq: 8000
save_top_k: 3
work_dir: ${save_path}/real_zarr/dpptp/${exp_name}/${seed}

hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false
