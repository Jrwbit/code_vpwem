defaults:
  - remember_color_3_emb
  - _self_

pipeline_name: dpptp_mikasa_multitask_emb
env_name: MIKASA-All-v0
data_root: /oss/sh2/vpwem_data/mikasa
task_datasets:
  - {name: RememberColor3-v0, path: '${data_root}/RememberColor3-v0'}
  - {name: ShellGameTouch-v0, path: '${data_root}/ShellGameTouch-v0'}
  - {name: RememberColor5-v0, path: '${data_root}/RememberColor5-v0'}
  - {name: InterceptGrabMedium-v0, path: '${data_root}/InterceptGrabMedium-v0'}

gradient_steps: 600000
diffusion_num_layers: 8
batch_size: 256
num_workers: 2
dataset_use_full_episodes: false
ema_rate: 0.999
adam_beta1: 0.9
adam_beta2: 0.999
save_freq: 100000
log_freq: 1000
keep_checkpoints: 3
save_path: /oss/sh2/vpwem_outputs
exp_name: mikasa_all_balanced_embedding_dpptp_bs256
group: dp_mikasa_multitask_emb
work_dir: ${save_path}/dpptp_mikasa_multitask_emb/${exp_name}/${seed}
