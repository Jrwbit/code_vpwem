pipeline_name: fair_history_mikasa
history_method: vpwem
env_name: ShellGameTouch-v0
dataset_path: /oss/sh2/vpwem_data/mikasa/${env_name}
mode: train
max_episode_steps: 90
shape_meta:
  action:
    shape: [8]
  obs:
    rgb:
      shape: [3, 128, 128]
      type: rgb
    rgb_wrist:
      shape: [3, 128, 128]
      type: rgb
    joints:
      shape: [25]
      type: low_dim
action_dim: 8
obs_steps: 2
action_steps: 8
horizon: 9
inference_action_steps: 4
rgb_model: resnet18
resize_shape: null
crop_shape: [100, 100]
random_crop: true
use_group_norm: true
use_seq: true
device: cuda:0
seed: 100
gradient_steps: 600000
batch_size: 16
num_workers: 4
diffusion_num_layers: 8
diffusion: ddpm
sample_steps: 50
temperature: 1.0
short_cond_dropout: 0.3
long_cond_dropout: 0.3
p_drop_emb: 0.0
p_drop_attn: 0.3
pred_reg_coeff: 0
memory_aux_coeff: 0.0
counterfactual_memory_coeff: 0.0
counterfactual_negative_mode: none
dataset_memory_subsample_ratio: 5
dataset_maximum_memory_length: 16
history_sampling_seed: 20260909
history_pool_size: 4
conversion_n_workers: 4
conversion_max_inflight_tasks: 20
lr: 0.0001
num_envs: 10
eval_episodes: 100
eval_seed_start: 1
ckpt: ${gradient_steps}
save_video: false
log_freq: 1000
save_freq: 100000
keep_checkpoints: 8
save_path: /oss/sh2/vpwem_outputs/fair_history_mikasa
work_dir: ${save_path}/${env_name}/${history_method}/seed${seed}
wandb_mode: offline
project: CleanDiffuser
group: fair_history_mikasa
exp_name: ${env_name}/${history_method}/seed${seed}
hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false
